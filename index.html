<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EP:05:16</title>
</head>
  <style>
    body {
      background-color: #7f7f7f;
    }
    #title {
      left: 200px;
      font-family: Pliant, sans-serif;
      color: white;
      text-align: center;
    }
    #firstTimeModal {
      position: fixed;
      top: 50%;
      left: 50%;
      height: 560px;
      width: 270px;
      border-radius: 10px;
      border: 5px solid #30404f;
      background-color: #3a4f63;
      z-index: 2;
      opacity: 0;
      transform: translate(-50%, -50%) scale(0.9);
      transition: all 0.3s ease;
    }
    .firstTimeModalText {
      text-align: center;
      font-family: Pliant, sans-serif;
      color: white;
    }
    #startButton {
      text-align: center;
      font-family: Pliant, sans-serif;
      background-color: #ffffff;
      color: #000000;
      border-radius: 20px;
      padding: 10px;
      display: block;
      margin: 0 auto;
    }
    #logo {
      margin-top: 5px;
      margin-bottom: 5px;
      margin-left: 10px;
      margin-right: 10px;
      width: 250px;
    }
   #overlay {
     z-index: 1;
     position: fixed;
     top: 0;
     left: 0;
     width: 100%;
     height: 100%;
     background: rgba(0, 0, 0, 0.5);
     opacity: 0;
     transition: opacity 0.3s ease;
     pointer-events: none;
  }
  #overlay.show {
    opacity: 1;
    pointer-events: none;
  }
  #firstTimeModal.show {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
  }
  #nav-bar {
    height: 15%;
    background-color: #303b6b;
    border-radius: 0px;
  }
  #shrinking-rect {
    background-color: #62e95d;
    height: 60px;
    width: 250px;
    left: 100px;
  }
  #bar-timer {
    background-color: #767676;
    border-radius: 5px;
    left: 90px;
    width: 280px;
    height: 80px;
  }
  </style>
<body>
  <div id="overlay"></div>
  <div id="firstTimeModal">
    <h2 class="firstTimeModalText">Welcome!</h2>
    <img id="logo" loading="eager" src="Untitled design.png" alt="Timer logo">
    <p class="firstTimeModalText"><strong>Welcome to EP:05:16.<br>“Make the best use of the time...” — Ephesians 5:16<br>This timer was created to help you focus, rest, study, and spend your time with purpose.</strong></p>
    <p class="firstTimeModalText">Press Start when you're ready.</p>
    <button id="startButton" onclick="closeWelcome()">Start</button>
  </div>
  <div id="nav-bar">
  </div>
  <div id="bar-timer">
    <div id="shrinking-rect"></div>
  </div>
  <button id="start-bar-timer" onclick="startTimer()">Start timer</button>
</body>
<script>
  const progress = document.getElementById("shrinking-rect");
  const elapsed = Date.now() - startTime; 
  const duration = 60000; // 60 seconds;
  const percent = 1 - elapsed / duration;
  const modal = document.getElementById("firstTimeModal");
  const overlay = document.getElementById("overlay");
  if (!localStorage.getItem("hasVisited")) {
    modal.style.display = "block";
    overlay.style.display = "block";
  
    setTimeout(() => {
      modal.classList.add("show");
      overlay.classList.add("show");
    }, 10);
  
    localStorage.setItem("hasVisited", "true");
  }
  
  function closeWelcome() {
    modal.classList.remove("show");
    overlay.classList.remove("show");
  
    setTimeout(() => {
      modal.style.display = "none";
      overlay.style.display = "none";
    }, 300);
  }
  function update() {
    const elapsed = Date.now() - startTime; 
    const percent = 1 - elapsed / duration;
    progress.style.width = (percent * 100) + "%";
    requestAnimationFrame(update);
  }
  function startTimer() {
    const startTime = Date.now();
    requestAnimationFrame(update);
  }
</script>
</html>
