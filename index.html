<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EP:05:16</title>
</head>
  <style>
    body {
      background-color: #7f7f7f;
    }
    #title {
      left: 200px;
      font-family: Pliant, sans-serif;
      color: white;
    }
    #firstTimeModal {
      position: fixed;
      top: 50%;
      left: 50%;
      height: 100px;
      width: 270px;
      border-radius: 10px;
      border: 5px solid #30404f;
      background-color: #3a4f63;
      z-index: 2;
      opacity: 0;
      transform: translate(-50%, -50%) scale(0.9);
      transition: all 0.3s ease;
    }
    .firstTimeModalText {
      text-align: center;
      font-family: Pliant, sans-serif;
      color: white;
    }
    #startButton {
      text-align: center;
      font-family: Pliant, sans-serif;
      background-color: #ffffff;
      color: #000000;
      border-radius: 20px;
      padding: 10px;
      display: block;
      margin: 0 auto;
    }
    #logo {
      margin-top: 5px;
      margin-bottom: 5px;
      margin-left: 10px;
      margin-right: 10px;
      width: 250px;
    }
   #overlay {
     z-index: 1;
     position: fixed;
     top: 0;
     left: 0;
     width: 100%;
     height: 100%;
     background: rgba(0, 0, 0, 0.5);
     opacity: 0;
     transition: opacity 0.3s ease;
     pointer-events: none;
  }
  #overlay.show {
    opacity: 1;
    pointer-events: none;
  }
  #firstTimeModal.show {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
  }
  </style>
<body>
  <h1 id="title">EP:05:16</h1>
  <div id="overlay"></div>
  <div id="firstTimeModal">
    <h2 class="firstTimeModalText">Welcome!</h2>
    <img id="logo" loading="eager" src="Untitled design.png" alt="Timer logo">
    <p class="firstTimeModalText"><strong>Welcome to EP:05:16.<br>“Make the best use of the time...” — Ephesians 5:16<br>This timer was created to help you focus, rest, study, and spend your time with purpose.</strong></p>
    <p class="firstTimeModalText">Press Start when you're ready.</p>
    <button id="startButton" onclick="closeWelcome()">Start</button>
  </div>
</body>
<script>
  const modal = document.getElementById("firstTimeModal");
  const overlay = document.getElementById("overlay");
  
  if (!localStorage.getItem("hasVisited")) {
    modal.style.display = "block";
    overlay.style.display = "block";
  
    setTimeout(() => {
      modal.classList.add("show");
      overlay.classList.add("show");
    }, 10);
  
    localStorage.setItem("hasVisited", "true");
  }
  
  function closeWelcome() {
    modal.classList.remove("show");
    overlay.classList.remove("show");
  
    setTimeout(() => {
      modal.style.display = "none";
      overlay.style.display = "none";
    }, 300);
  }
</script>
</html>
